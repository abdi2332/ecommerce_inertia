version: "3.8"

services:
    # Nginx Web Server (like hosting provider's web server)
    nginx:
        image: nginx:alpine
        container_name: laravel-nginx
        restart: always
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./docker/nginx/ssl:/etc/nginx/ssl
        depends_on:
            - php
            - vite
        networks:
            - laravel

    # PHP-FPM with Laravel extensions
    php:
        build:
            context: ./docker/php
            dockerfile: Dockerfile
        container_name: laravel-php
        restart: always
        volumes:
            - ./:/var/www/html
            - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
        working_dir: /var/www/html
        networks:
            - laravel
        depends_on:
            - mysql
            - redis

    # Vite Dev Server for React (Hot Module Replacement)
    vite:
        image: node:20-alpine
        container_name: laravel-vite
        restart: always
        ports:
            - "5173:5173"  # Vite dev server
        volumes:
            - ./:/var/www/html
        working_dir: /var/www/html
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        networks:
            - laravel

    # Laravel Reverb WebSocket Server
    reverb:
        build:
            context: ./docker/php
            dockerfile: Dockerfile
        container_name: laravel-reverb
        restart: always
        ports:
            - "8080:8080"  # WebSocket server port
        volumes:
            - ./:/var/www/html
            - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
        working_dir: /var/www/html
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        networks:
            - laravel
        depends_on:
            - mysql
            - redis

    mysql:
        image: mysql:8.0
        container_name: laravel-mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: laravel_db
            MYSQL_USER: laravel_user
            MYSQL_PASSWORD: secret
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
            - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
        networks:
            - laravel

    redis:
        image: redis:7
        container_name: laravel-redis
        restart: always
        ports:
            - "6379:6379"
        networks:
            - laravel

    typesense:
        image: typesense/typesense:0.25.0
        container_name: typesense
        restart: always
        ports:
            - "8108:8108"
        volumes:
            - typesense_data:/data
        environment:
            TYPESENSE_API_KEY: xyz
            TYPESENSE_DATA_DIR: /data
        networks:
            - laravel

    # phpMyAdmin for database management (optional but helpful)
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: laravel-phpmyadmin
        restart: always
        ports:
            - "8081:80"
        environment:
            PMA_HOST: mysql
            PMA_USER: root
            PMA_PASSWORD: root
        depends_on:
            - mysql
        networks:
            - laravel

networks:
    laravel:
        driver: bridge

volumes:
    mysql_data:
    typesense_data: