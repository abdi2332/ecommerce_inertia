version: "3.8"

services:
    mysql:
        image: mysql:8.0
        container_name: laravel-mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: laravel_db
            MYSQL_USER: laravel_user
            MYSQL_PASSWORD: secret
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
            - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql  # This runs every time container starts
        networks:
            - laravel

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel-app
        volumes:
            - ./:/var/www/html
        networks:
            - laravel
        depends_on:
            - mysql
            - redis
            - typesense
        environment:
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: laravel_db
            DB_USERNAME: laravel_user
            DB_PASSWORD: secret

    nginx:
        image: nginx:stable
        container_name: laravel-nginx
        ports:
            - "80:80"
        volumes:
            - ./:/var/www/html
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - laravel

    redis:
        image: redis:7
        container_name: laravel-redis
        ports:
            - "6379:6379"
        networks:
            - laravel

    typesense:
        image: typesense/typesense:0.25.0
        container_name: typesense
        ports:
            - "8108:8108"
        volumes:
            - typesense_data:/data
        environment:
            TYPESENSE_API_KEY: xyz
            TYPESENSE_DATA_DIR: /data
        networks:
            - laravel

networks:
    laravel:
        driver: bridge

volumes:
    mysql_data:
    typesense_data: